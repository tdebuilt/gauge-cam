name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: test/host/run.sh

  firmware:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release assets on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe gives the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Build
        env:
          GAUGECAM_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: pio run && tools/make_factory.sh
      - name: Flasher site
        run: |
          mkdir -p site
          cp flasher/index.html dist/gauge-cam-factory.bin dist/gauge-cam.bin web/*.woff2 web/fonts-license.txt site/
          python3 - <<'PY'
          import json, re
          version = re.search(r'"(.*)"', open("src/generated/version.h").read()).group(1)
          manifest = {
              "name": "Gauge Cam",
              "version": version,
              "new_install_prompt_erase": True,
              "new_install_improv_wait_time": 20,
              "release_url": "https://github.com/${{ github.repository }}/releases/latest",
              "builds": [{"chipFamily": "ESP32",
                          "parts": [{"path": "gauge-cam-factory.bin", "offset": 0}]}],
          }
          json.dump(manifest, open("site/manifest.json", "w"), indent=2)
          print(manifest["version"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site
      # The release notes are the tag's section of CHANGELOG.md, then a link to
      # it. Home Assistant shows their first 250 characters on the Firmware
      # entity. No section, no release.
      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          tag="$GITHUB_REF_NAME"
          # The section without its leading and trailing blank lines.
          awk -v h="## $tag" '$0 == h {f=1; next} f && /^## / {exit} f {l[n++] = $0}
            END {a = 0; b = n - 1; while (a <= b && l[a] !~ /[^ ]/) a++
                 while (b >= a && l[b] !~ /[^ ]/) b--; for (i = a; i <= b; i++) print l[i]}' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section '## $tag'"; exit 1
          fi
          printf '\n[Changelog](https://github.com/%s/blob/main/CHANGELOG.md#%s)\n' \
            "$GITHUB_REPOSITORY" "$(printf '%s' "$tag" | tr -d '.')" >> release-notes.md
          cat release-notes.md
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body_path: release-notes.md

  pages:
    needs: firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes close together: deploy one after the other, the newest last.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
