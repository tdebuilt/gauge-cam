<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Gauge Cam</title>
<link rel="preload" href="/gaugemono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="hd">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8.5 21A9 9 0 0 1 16 7" fill="none" stroke="#e5484d" stroke-width="2.4" stroke-linecap="round"/><path d="M16 16l6-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg>
  <b id="title">Gauge Cam</b>
  <span class="su-title" data-i18n="su.title"></span>
  <nav id="tabs" class="tabs">
    <button data-tab="reading" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16a8 8 0 1 1 16 0" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 16l4-5" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="tab.reading"></span></button>
    <button data-tab="dial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="tab.dial"></span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="tab.settings"></span></button>
  </nav>
  <div class="leds">
    <span id="led-wifi" class="led">Wi-Fi</span>
    <span id="led-mqtt" class="led">MQTT</span>
    <span id="led-cam" class="led" data-i18n="led.camera"></span>
    <select id="lang" aria-label="Language"></select>
  </div>
</header>
<main>

<section id="setup" hidden>
  <div class="su-bar" id="su-bar">
    <div class="prog" id="su-prog"></div>
    <span class="su-kick" id="su-kick"></span>
    <button class="btn" id="su-later" data-i18n="su.later"></button>
  </div>
  <div class="su-page pnl dpanel su-welcome" data-page="welcome">
    <h1 data-i18n="su.title"></h1>
    <p class="okline" id="su-wifi"></p>
    <button class="btn" id="su-wifi-set" data-i18n="su.wifi.set"></button>
    <p class="mut" data-i18n="su.lead"></p>
    <ol class="su-list" id="su-list"></ol>
    <div class="foot"><button class="btn" id="su-skip" data-i18n="su.later"></button><button class="btn pri" id="su-start" data-i18n="su.start"></button></div>
  </div>
  <div class="su-page pnl dpanel" data-page="tank">
    <h2 data-i18n="su.tank.title"></h2>
    <div id="su-tank"></div>
    <div class="foot"><button class="btn" data-su-go="check" data-i18n="common.back"></button><button class="btn" id="su-no-tank" data-i18n="su.tank.none"></button><button class="btn pri" id="su-tank-next" data-i18n="d.continue"></button></div>
  </div>
  <div class="su-page pnl dpanel" data-page="ha">
    <h2 data-i18n="su.ha.title"></h2>
    <p class="mut" data-i18n="su.ha.help"></p>
    <form id="su-mqtt" class="form">
      <label class="f"><span data-i18n="n.name"></span> <input name="name" autocomplete="off" maxlength="40">
        <small data-i18n="su.ha.nameHelp"></small></label>
      <label class="f"><span data-i18n="su.ha.host"></span> <input name="mqtt_host" autocomplete="off" spellcheck="false" placeholder="192.168.1.10">
        <small data-i18n="su.ha.hostHelp"></small></label>
      <label class="f"><span data-i18n="n.user"></span> <input name="mqtt_user" autocomplete="off" spellcheck="false"></label>
      <label class="f"><span data-i18n="n.password"></span> <input name="mqtt_pass" type="password" autocomplete="new-password"></label>
      <p class="status" id="su-mqtt-result"></p>
      <small data-i18n-html="su.ha.none"></small>
      <div class="foot"><button type="button" class="btn" data-su-go="tank" data-i18n="common.back"></button><button class="btn pri" id="su-mqtt-go" data-i18n="su.ha.test"></button></div>
    </form>
  </div>
</section>

<section id="tab-reading" class="tab on">
  <div class="home">
    <div class="inst">
      <div class="gwrap">
        <svg id="r-gauge" class="gauge" viewBox="0 0 300 300" aria-hidden="true"></svg>
        <div class="bigv"><div class="v" id="r-big">–</div><div class="s" id="r-sub"></div></div>
      </div>
      <div class="trio">
        <div><div class="l" data-i18n="r.percent"></div><div class="v" id="r-percent">–</div></div>
        <div><div class="l" id="r-second-label"></div><div class="v" id="r-second">–</div></div>
        <div><div class="l" data-i18n="r.nextAt"></div><div class="v" id="r-next">–</div></div>
      </div>
      <div class="row center"><button id="r-read" class="btn pri" data-i18n="r.read"></button></div>
    </div>
    <div class="side">
      <div class="pnl todo" id="r-todo" hidden>
        <h3><span id="r-todo-title"></span><span id="r-todo-count"></span></h3>
        <ul class="todo-list" id="r-todo-list"></ul>
      </div>
      <div class="pnl todo" id="r-done" hidden>
        <h3><span data-i18n="r.done.title"></span><button class="x" id="r-done-close" data-i18n-title="r.done.close">×</button></h3>
        <p id="r-done-text" class="help"></p>
      </div>
      <div class="pnl">
        <h3><span data-i18n="r.reading"></span><span id="r-state"></span></h3>
        <p id="r-status" class="status"></p>
        <dl class="kv">
          <dt data-i18n="r.lastAt"></dt><dd id="r-last">–</dd>
          <dt data-i18n="r.contrast"></dt><dd id="r-contrast">–</dd>
          <dt data-i18n="r.refused"></dt><dd id="r-refused">0</dd>
          <dt data-i18n="s.version"></dt><dd id="r-version">–</dd>
        </dl>
      </div>
      <div class="pnl">
        <h3 data-i18n="r.photo"></h3>
        <div class="viewer"><div class="stage"><img id="r-photo" alt=""><canvas id="r-overlay"></canvas></div></div>
      </div>
      <div class="pnl" id="r-failures" hidden>
        <h3 data-i18n="r.failures"></h3>
        <p class="help" data-i18n="r.failures.help"></p>
        <div id="r-failure-list" class="failures"></div>
      </div>
    </div>
  </div>
</section>

<section id="tab-dial" class="tab">
  <div class="cal">
    <nav class="rail" id="d-steps">
      <button data-step="photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="d.step.photo"></span></button>
      <button data-step="frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 12h4M12 10v4" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="d.step.frame"></span></button>
      <button data-step="grad"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17a8 8 0 1 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="17" r="2" fill="currentColor"/><circle cx="7" cy="8" r="2" fill="currentColor"/><circle cx="12" cy="5" r="2" fill="currentColor"/></svg><span data-i18n="d.step.grad"></span></button>
      <button data-step="check"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12.5l2.7 2.7L16 9.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="d.step.check"></span></button>
    </nav>
    <div class="dview">
      <div class="viewer" id="d-viewer"><img id="d-photo-img" alt=""><canvas id="d-overlay"></canvas>
        <form class="bubble" id="d-bubble" hidden><input id="d-bubble-value" inputmode="decimal" autocomplete="off" data-i18n-placeholder="d.value"><button class="btn pri" type="submit">OK</button><button class="btn" type="button" id="d-bubble-del" data-i18n-title="d.delete">×</button></form>
      </div>
      <div class="vbar">
        <div class="zoom"><button class="btn" id="d-zoom-out" data-i18n-title="d.zoomOut">−</button><span id="d-zoom-level"></span><button class="btn" id="d-zoom-in" data-i18n-title="d.zoomIn">+</button></div>
        <small data-i18n="d.zoomHelp"></small>
        <span id="d-dirty" class="dirty" data-i18n="d.dirty" hidden></span>
      </div>
    </div>
    <aside class="pnl panel dpanel">
      <div class="dstep" data-step="photo">
        <h2 data-i18n="d.photo.title"></h2>
        <p class="mut" data-i18n="d.photo.help"></p>
        <form id="d-shot" class="shot">
          <label><span data-i18n="c.led"></span>
            <span class="range"><input name="led_intensity" type="range" min="0" max="255" step="5"><output id="d-led-value"></output></span></label>
          <label><span data-i18n="d.rotation"></span>
            <select name="rotation"><option value="0">0°</option><option value="90">90° ↻</option><option value="180">180°</option><option value="270">270° ↻</option></select></label>
          <label class="check"><input name="vflip" type="checkbox"> <span data-i18n="c.vflip"></span></label>
          <label class="check"><input name="hmirror" type="checkbox"> <span data-i18n="c.hmirror"></span></label>
          <details class="more">
            <summary data-i18n="common.more"></summary>
            <label><span data-i18n="c.ledMs"></span> <input name="led_ms" type="number" min="0" max="5000" step="50"></label>
            <label><span data-i18n="c.framesize"></span> <select name="framesize"><option>QVGA</option><option>VGA</option><option>SVGA</option></select></label>
            <label><span data-i18n="c.brightness"></span> <input name="cam_brightness" type="number" min="-2" max="2"></label>
            <label><span data-i18n="c.contrast"></span> <input name="cam_contrast" type="number" min="-2" max="2"></label>
            <label class="check"><input name="exposure_auto" type="checkbox"> <span data-i18n="d.exposureAuto"></span></label>
            <label class="manual-exposure"><span data-i18n="d.exposure"></span>
              <span class="range"><input name="exposure" type="range" min="0" max="1200" step="10"><output id="d-exposure-value"></output></span></label>
            <label class="manual-exposure"><span data-i18n="d.gain"></span>
              <span class="range"><input name="gain" type="range" min="0" max="30" step="1"><output id="d-gain-value"></output></span></label>
            <small class="manual-exposure" data-i18n="d.exposure.help"></small>
          </details>
        </form>
        <div class="foot"><button id="d-photo" class="btn" data-i18n="d.retake"></button><button class="btn pri" data-go="frame" data-i18n="common.next"></button></div>
      </div>
      <div class="dstep" data-step="frame">
        <h2 data-i18n="d.frame.title"></h2>
        <p class="mut" data-i18n="d.frame.help"></p>
        <p class="okline" id="d-pivot-line"></p>
        <p class="hint" data-i18n="d.pivot.hint"></p>
        <details class="more">
          <summary data-i18n="common.more"></summary>
          <label><span data-i18n="d.mode"></span>
            <select id="d-mode"><option value="hub" data-i18n="d.mode.hub"></option><option value="fixed" data-i18n="d.mode.fixed"></option></select></label>
        </details>
        <div class="foot"><button class="btn" data-go="photo" data-i18n="common.back"></button><button class="btn pri" data-go="grad" data-i18n="common.next"></button></div>
      </div>
      <div class="dstep" data-step="grad">
        <label><span data-i18n="d.model"></span>
          <select id="d-model"><option value="tank" data-i18n="d.model.tank"></option><option value="pct" data-i18n="d.model.pct"></option><option value="free" data-i18n="d.model.free"></option></select></label>
        <label id="d-end-box"><span data-i18n="d.end"></span> <input id="d-end" type="number" min="20" max="1000" step="10" inputmode="numeric"></label>
        <label id="d-unit-box"><span data-i18n="d.unit"></span> <input id="d-unit" size="6"></label>
        <h2 id="d-seq-title"></h2>
        <p class="mut" id="d-seq-help"></p>
        <p><button class="btn" id="d-skip" hidden></button></p>
        <div class="chips" id="d-chips"></div>
        <div class="foot"><button class="btn" id="d-undo" data-i18n="d.undo"></button><button class="btn pri" data-go="check" id="d-to-check" data-i18n="d.continue"></button></div>
      </div>
      <div class="dstep" data-step="check">
        <h2 id="d-check-title"></h2>
        <p class="mut" id="d-check-help"></p>
        <dl class="kv" id="d-check-kv"></dl>
        <div class="foot"><button class="btn" data-go="grad" id="d-check-no"></button><button class="btn" id="d-test"></button><button class="btn pri" id="d-save"></button></div>
      </div>
    </aside>
  </div>
</section>

<section id="tab-settings" class="tab">
  <div class="set">
    <nav id="snav" class="snav">
      <button data-sub="tank" class="on"><span data-i18n="tab.tank"></span><small id="sn-tank"></small></button>
      <button data-sub="camera"><span data-i18n="tab.camera"></span><small id="sn-camera"></small></button>
      <button data-sub="network"><span data-i18n="tab.network"></span><small id="sn-network"></small></button>
      <button data-sub="system"><span data-i18n="tab.system"></span><small id="sn-system"></small></button>
    </nav>
    <div>

      <div id="sub-tank" class="sub pnl on">
        <h3 data-i18n="t.title"></h3>
        <form id="f-tank" class="form">
          <input type="hidden" name="tank_shape">
          <div class="shapes" id="t-shapes">
            <button type="button" data-shape="box"><svg viewBox="0 0 48 36" aria-hidden="true"><path d="M6 10l10-6h26v22l-10 6H6z M6 10h26v22 M32 10l10-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span data-i18n="t.shape.box"></span></button>
            <button type="button" data-shape="hcyl"><svg viewBox="0 0 48 36" aria-hidden="true"><path d="M12 6h24a12 12 0 0 1 0 24H12a12 12 0 0 1 0-24z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 6a5 12 0 0 1 0 24" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/></svg><span data-i18n="t.shape.hcyl"></span></button>
            <button type="button" data-shape="vcyl"><svg viewBox="0 0 48 36" aria-hidden="true"><ellipse cx="24" cy="7" rx="11" ry="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M13 7v22a11 4 0 0 0 22 0V7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg><span data-i18n="t.shape.vcyl"></span></button>
            <button type="button" data-shape="table"><svg viewBox="0 0 48 36" aria-hidden="true"><path d="M8 30L18 22L28 14L40 6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M6 4v28h38" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/></svg><span data-i18n="t.shape.table"></span></button>
          </div>
          <p class="help" id="t-shape-help"></p>
          <input type="hidden" name="tank_by" value="cap">
          <div class="seg" id="t-by" data-shapes="box hcyl vcyl"><span data-i18n="t.by"></span><button type="button" data-tank-by="cap" data-i18n="t.by.cap"></button><button type="button" data-tank-by="dim" data-i18n="t.by.dim"></button></div>
          <div class="fld" data-by="cap">
            <label class="f"><span data-i18n="t.capacity"></span> <input name="cap_l" type="number" step="1" min="0"></label>
            <label class="f"><span id="t-cap-height"></span> <input name="cap_height_cm" type="number" step="0.1" min="0">
              <small id="t-cap-proposed"></small></label>
          </div>
          <p class="help" data-by="dim" data-i18n-html="t.help"></p>
          <div class="fld" data-by="dim">
            <label class="f" data-shapes="box hcyl"><span data-i18n="t.length"></span> <input name="tank_length_cm" type="number" step="0.1" min="0"></label>
            <label class="f" data-shapes="box"><span data-i18n="t.width"></span> <input name="tank_width_cm" type="number" step="0.1" min="0"></label>
            <label class="f" data-shapes="hcyl vcyl"><span data-i18n="t.diameter"></span> <input name="tank_diameter_cm" type="number" step="0.1" min="0"></label>
            <label class="f" data-shapes="box vcyl"><span data-i18n="t.height"></span> <input name="tank_height_cm" type="number" step="0.1" min="0"></label>
          </div>
          <label class="f wide" data-shapes="table"><span data-i18n="t.table"></span>
            <textarea name="tank_table_text" rows="8" spellcheck="false" placeholder="0 0&#10;40 520&#10;150 3000"></textarea>
            <small data-i18n="t.table.help"></small></label>
          <details class="more">
            <summary data-i18n="common.more"></summary>
            <label class="f"><span data-i18n="t.offset"></span> <input name="level_offset_cm" type="number" step="0.1">
              <small data-i18n="t.offset.help"></small></label>
          </details>
          <div class="capline">
            <div><div class="l" data-i18n="t.capacityLabel"></div><div class="v" id="t-capacity-value">–</div><small id="t-capacity"></small></div>
            <button class="btn pri" data-i18n="common.save"></button>
          </div>
        </form>
      </div>

      <div id="sub-camera" class="sub pnl">
        <h3 data-i18n="tab.camera"></h3>
        <form id="f-camera" class="form">
          <label class="f"><span data-i18n="c.interval"></span> <input name="interval_min" type="number" min="1" step="1"></label>
          <p class="help" data-i18n="c.moved"></p>
          <label class="f"><span data-i18n="c.jpeg"></span> <input name="jpeg_quality" type="number" min="4" max="63"></label>
          <label class="f"><span data-i18n="c.minContrast"></span> <input name="min_contrast" type="number" min="0" max="255">
            <small data-i18n="c.minContrast.help"></small></label>
          <label class="f"><span data-i18n="c.samples"></span> <input name="samples" type="number" min="1" max="5">
            <small data-i18n="c.samples.help"></small></label>
          <label class="f"><span data-i18n="c.maxJump"></span> <input name="max_jump" type="number" min="0" step="0.5">
            <small data-i18n="c.maxJump.help"></small></label>
          <button class="btn pri" data-i18n="common.save"></button>
        </form>
      </div>

      <div id="sub-network" class="sub pnl">
        <h3 data-i18n="tab.network"></h3>
        <form id="f-network" class="form">
          <label class="f"><span data-i18n="n.name"></span> <input name="name"></label>
          <label class="f"><span data-i18n="n.lang"></span> <select name="lang"><option value="fr">Français</option><option value="en">English</option></select></label>
          <h4 data-i18n="n.wifi"></h4>
          <label class="f"><span data-i18n="n.ssid"></span> <input name="wifi_ssid" list="ssids"><datalist id="ssids"></datalist></label>
          <button type="button" id="n-scan" class="btn" data-i18n="n.scan"></button>
          <label class="f"><span data-i18n="n.password"></span> <input name="wifi_pass" type="password" autocomplete="new-password"></label>
          <h4 data-i18n="n.mqtt"></h4>
          <label class="f"><span data-i18n="n.host"></span> <input name="mqtt_host">
            <small data-i18n="n.host.help"></small></label>
          <label class="f"><span data-i18n="n.port"></span> <input name="mqtt_port" type="number" min="1" max="65535"></label>
          <label class="f"><span data-i18n="n.user"></span> <input name="mqtt_user"></label>
          <label class="f"><span data-i18n="n.password"></span> <input name="mqtt_pass" type="password" autocomplete="new-password"></label>
          <button type="button" id="n-mqtt-test" class="btn" data-i18n="n.test"></button>
          <label class="f"><span data-i18n="n.prefix"></span> <input name="mqtt_prefix"></label>
          <label class="check"><input name="ha_discovery" type="checkbox"> <span data-i18n="n.discoveryOn"></span></label>
          <label class="f"><span data-i18n="n.discovery"></span> <input name="discovery_prefix"></label>
          <h4 data-i18n="n.services"></h4>
          <label class="f"><span data-i18n="n.ntp"></span> <input name="ntp_server">
            <small data-i18n="n.ntp.help"></small></label>
          <label class="check"><input name="update_check" type="checkbox"> <span data-i18n="n.updateCheck"></span></label>
          <label class="f"><span data-i18n="n.updateUrl"></span> <input name="update_url" type="url" placeholder="GitHub">
            <small data-i18n-html="n.updateUrl.help"></small></label>
          <h4 data-i18n="n.access"></h4>
          <label class="f"><span data-i18n="n.uiPassword"></span> <input name="ui_password" type="password" autocomplete="new-password"></label>
          <label class="check"><input name="ui_password_clear" type="checkbox"> <span data-i18n="n.uiClear"></span></label>
          <label class="f"><span data-i18n="n.apPassword"></span> <input name="ap_password" type="password" autocomplete="new-password" minlength="8" maxlength="63">
            <small data-i18n="n.apPassword.help"></small></label>
          <label class="check"><input name="ap_password_clear" type="checkbox"> <span data-i18n="n.apClear"></span></label>
          <button class="btn pri" data-i18n="common.save"></button>
        </form>
      </div>

      <div id="sub-system" class="sub pnl">
        <h3 data-i18n="tab.system"></h3>
        <dl id="s-info" class="kv"></dl>
        <h4 data-i18n="s.update"></h4>
        <p id="s-release" class="status"></p>
        <div class="actions">
          <button id="s-check" class="btn" data-i18n="s.check"></button>
          <button id="s-install" class="btn pri" hidden></button>
          <progress id="s-ota-progress" max="100" value="0" hidden></progress>
        </div>
        <p class="help" data-i18n-html="s.update.help"></p>
        <div class="actions">
          <input id="s-file" type="file" accept=".bin">
          <button id="s-update" class="btn" data-i18n="s.updateButton"></button>
          <progress id="s-progress" max="100" value="0" hidden></progress>
        </div>
        <h4 data-i18n="s.backup"></h4>
        <p class="help" data-i18n="s.backup.help"></p>
        <div class="actions">
          <button id="s-export" class="btn" data-i18n="s.export"></button>
          <label class="btn"><span data-i18n="s.import"></span><input id="s-import" type="file" accept=".json" hidden></label>
          <button id="s-restart" class="btn" data-i18n="s.restart"></button>
        </div>
        <h4 data-i18n="s.log"></h4>
        <p class="help" data-i18n="s.log.help"></p>
        <div class="actions"><button id="s-log-refresh" class="btn" data-i18n="s.logRefresh"></button></div>
        <pre id="s-log" class="log"></pre>
      </div>

    </div>
  </div>
</section>

</main>
<div id="toast" hidden></div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
