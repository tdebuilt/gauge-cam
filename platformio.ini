; ESP32-CAM (AI-Thinker) firmware. Build: pio run ; host tests: test/host/run.sh
[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
; Two 1.9 MB app slots for over-the-air updates, no file system needed:
; the web interface is compiled into the firmware.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    knolleary/PubSubClient@2.8
extra_scripts = pre:tools/prebuild.py
